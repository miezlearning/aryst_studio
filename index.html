<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="ARYST: Galeri Kurasi Foto Klien" />
    
    <!-- Content Security Policy (PRD Sec. Model Keamanan Siber) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com https://drive.google.com https://images.unsplash.com https://assets.mixkit.co; media-src 'self' blob: https: data: http://localhost:9199; connect-src 'self' https://www.googleapis.com https://script.google.com https://script.googleusercontent.com https://assets.mixkit.co https://*.peerjs.com wss://*.peerjs.com https://lh3.googleusercontent.com https://*.googleusercontent.com https://images.unsplash.com https://firestore.googleapis.com https://firebasestorage.googleapis.com https://*.r2.cloudflarestorage.com http://localhost:8080 http://localhost:9199; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'none';" />

    <!-- Frame-busting Script (Anti Clickjacking PRD Sec. 4) -->
    <script>
      if (window.top !== window.self) {
        window.top.location.replace(window.self.location.href);
      }
    </script>

    <!-- Typography: Figtree (Modern geometric sans akin to Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ARYST</title>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500/20 selection:text-amber-300 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
